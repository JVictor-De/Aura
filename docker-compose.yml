## Zoe Ecosystem — Docker Compose
##
## Referências:
## - prompt.md §4: Docker Compose file que suba backend + banco + redis com um comando
## - ARCHITECTURE.md §Infrastructure: PostgreSQL + PostGIS, Redis
##
## Uso: docker compose up --build

services:
  # ── PostgreSQL + PostGIS ────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zoe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoe
      POSTGRES_PASSWORD: zoe_secret_2024
      POSTGRES_DB: zoe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoe -d zoe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zoe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoe_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://zoe:zoe_secret_2024@postgres:5432/zoe_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: zoe-jwt-secret-change-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      STOCK_RESERVATION_TTL_SECONDS: 900
      IDEMPOTENCY_TTL_SECONDS: 3600
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
