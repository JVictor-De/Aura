name: zoe_app
description: Zoe - Luxury Fashion Delivery (Client App)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.2
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Image Cache
  cached_network_image: ^3.3.1

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # Routing
  go_router: ^13.0.1

  # Geo / Maps
  geolocator: ^10.1.0
  # google_maps_flutter: ^2.5.3  # Android/iOS only — enable when targeting mobile

  # Push Notifications (stubs only — Firebase config needed for real builds)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.10

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.2.1
  intl: ^0.18.1
  synchronized: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  # Fonts served via google_fonts package — no local assets needed
