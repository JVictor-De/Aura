name: zoe_portal
description: Zoe Portal - Dashboard do Lojista (Flutter Web)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Routing
  go_router: ^13.0.1

  # Local Storage (web)
  shared_preferences: ^2.2.2

  # UI
  data_table_2: ^2.5.8
  google_fonts: ^6.1.0

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
